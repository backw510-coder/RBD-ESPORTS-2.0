<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBD ESPORTS - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b12;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            background: #171728;
            padding: 30px 20px;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #333344;
            border-radius: 10px;
            background: #0f0f19;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .register a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>RBD ESPORTS 2.0</h1>
    <p class="subtitle">Login to your account</p>

    <input type="text" placeholder="Phone / Email">

    <input type="password" placeholder="Password">

    <button>Login</button>

    <div class="register">
        Don't have an account?
        <a href="#">Register</a>
    </div>

</div>

</body>
</html>
