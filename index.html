<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBD ESPORTS 2.0</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b12;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #151522;
            border-bottom: 1px solid #29293a;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 6px;
            color: #aaa;
        }

        .balance {
            margin: 20px;
            padding: 20px;
            background: #171728;
            border-radius: 15px;
            text-align: center;
        }

        .balance h2 {
            font-size: 16px;
            color: #aaa;
        }

        .balance .money {
            font-size: 30px;
            margin: 8px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .deposit {
            background: #19c37d;
            color: white;
        }

        .withdraw {
            background: #e74c3c;
            color: white;
        }

        .section {
            padding: 20px;
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .tournament {
            background: #171728;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 12px;
        }

        .tournament h3 {
            margin-bottom: 8px;
        }

        .tournament p {
            color: #aaa;
            margin-bottom: 12px;
        }

        .join {
            width: 100%;
            background: #5865f2;
            color: white;
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #151522;
            display: flex;
            justify-content: space-around;
            padding: 15px 5px;
        }

        .nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }

        .nav a:hover {
            color: white;
        }

        .content {
            padding-bottom: 80px;
        }
    </style>
</head>

<body>

<div class="content">

    <div class="header">
        <h1>RBD ESPORTS 2.0</h1>
        <p>Free Fire Tournament</p>
    </div>

    <div class="balance">
        <h2>My Balance</h2>
        <div class="money">৳ 0.00</div>

        <div class="buttons">
            <button class="deposit">Deposit</button>
            <button class="withdraw">Withdraw</button>
        </div>
    </div>

    <div class="section">
        <h2>🔥 Live Tournaments</h2>

        <div class="tournament">
            <h3>🐺 Lone Wolf</h3>
            <p>Entry Fee: ৳50 | Prize: ৳70</p>
            <button class="join">Join Tournament</button>
        </div>

        <div class="tournament">
            <h3>🎯 BR Solo</h3>
            <p>Entry Fee: ৳10 | Kill: ৳5</p>
            <button class="join">Join Tournament</button>
        </div>

        <div class="tournament">
            <h3>⚔️ CS 4v4</h3>
            <p>Entry Fee: ৳50 Per Player</p>
            <button class="join">Join Tournament</button>
        </div>
    </div>

</div>

<div class="nav">
    <a href="#">🏠 Home</a>
    <a href="#">🏆 Matches</a>
    <a href="#">💰 Wallet</a>
    <a href="#">👤 Profile</a>
</div>

</body>
</html>
